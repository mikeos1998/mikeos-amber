name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build Mike OS Amber
        run: docker run --rm --privileged -v "$PWD:/work" -w /work debian:bookworm bash build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: mikeos-amber-iso
          path: out/mikeos-amber.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
